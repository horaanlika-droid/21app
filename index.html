<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>21 — городская ОС</title>
<link rel="icon" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* ============================================================
   21 — городская ОС · skin «Vista Pixel»
   палитра: белый / чёрный / серые / #d4a373
   ============================================================ */
:root{
  --acc:#d4a373;
  --acc-d:#a87c4f;
  --ink:#111;
  --line:#999;
  --soft:#f4f4f4;
  --pix:'Press Start 2P', ui-monospace, monospace;
  --body:'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
  --tb:46px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--body); color:var(--ink); background:#fff;
  user-select:none; -webkit-user-select:none;
}
img,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#eee;border-left:1px solid #ddd}
::-webkit-scrollbar-thumb{background:#333;border:2px solid #eee}
::-webkit-scrollbar-thumb:hover{background:var(--acc-d)}

/* ---------- рабочий стол ---------- */
#desktop{
  position:fixed;inset:0;overflow:hidden;
  background:#fff;
}
#desktop .wp{
  position:absolute;inset:0;
  background:url('assets/wallpaper.png') repeat;
}
#desktop .sky{
  position:absolute;left:0;right:0;bottom:var(--tb);height:80px;
  background:url('assets/skyline.png') repeat-x bottom;
  opacity:.9;pointer-events:none;
}
#desktop .sun{
  position:absolute;top:26px;right:40px;width:34px;height:34px;
  background:url('assets/sun.png') no-repeat;pointer-events:none;
  animation:sunPulse 4s steps(2) infinite;
}
@keyframes sunPulse{0%,100%{opacity:.95}50%{opacity:.75}}
.cloud{
  position:absolute;width:64px;height:26px;
  background:url('assets/cloud.png') no-repeat;pointer-events:none;opacity:.8;
}
.cloud.c1{top:60px;left:-80px;animation:drift 70s linear infinite}
.cloud.c2{top:120px;left:-80px;animation:drift 110s linear infinite 20s}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 160px))}}

/* ---------- иконки стола ---------- */
#icons{
  position:absolute;top:12px;left:12px;bottom:var(--tb);
  display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;
  gap:6px;width:84px;
}
.dicon{
  width:76px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;
  border:1px solid transparent;border-radius:4px;cursor:pointer;
}
.dicon img{width:34px;height:34px}
.dicon span{
  font-family:var(--pix);font-size:7px;line-height:1.5;text-align:center;color:#111;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 4px #fff,0 0 6px #fff;
  word-break:break-word;
}
.dicon:hover{background:rgba(212,163,115,.18);border-color:rgba(212,163,115,.7)}
.dicon.sel{background:rgba(212,163,115,.28);border-color:var(--acc)}

/* ---------- окна (Vista) ---------- */
#wins{position:absolute;inset:0;bottom:var(--tb);pointer-events:none}
.win{
  position:absolute;min-width:260px;
  background:rgba(255,255,255,.97);
  border:1px solid #8a8a8a;border-radius:8px 8px 6px 6px;
  box-shadow:0 10px 30px rgba(0,0,0,.22),0 0 0 1px rgba(255,255,255,.6) inset;
  display:flex;flex-direction:column;overflow:hidden;
  pointer-events:auto;
  animation:winIn .16s ease-out;
}
@keyframes winIn{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.win.min{display:none}
.win.closing{animation:winOut .12s ease-in forwards}
@keyframes winOut{to{transform:scale(.94);opacity:0}}
.wtitle{
  height:32px;flex:0 0 32px;display:flex;align-items:center;gap:7px;padding:0 6px;
  background:linear-gradient(#ffffff,#ececec);
  border-bottom:1px solid #c9c9c9;cursor:default;
  box-shadow:0 1px 0 #fff inset;
}
.win.inact .wtitle{background:linear-gradient(#f7f7f7,#efefef)}
.win.inact{border-color:#c2c2c2;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.wtitle .sq{width:5px;height:5px;background:var(--acc);border:1px solid #000;flex:0 0 5px}
.wtitle img{width:17px;height:17px}
.wtitle .t{
  flex:1;font-family:var(--pix);font-size:8px;color:#222;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.win.inact .wtitle .t{color:#999}
.wbtns{display:flex;gap:3px}
.wbtn{
  width:27px;height:21px;border:1px solid #8a8a8a;border-radius:3px 3px 2px 2px;
  background:linear-gradient(#fff,#dcdcdc);
  display:flex;align-items:center;justify-content:center;
}
.wbtn:hover{background:linear-gradient(#fff,#cfcfcf);border-color:#555}
.wbtn.close:hover{background:linear-gradient(#e8b98c,var(--acc));border-color:#8c6239}
.wbtn svg{display:block}
.wcontent{flex:1;overflow:auto;position:relative;background:#fff}

/* ---------- панель задач ---------- */
#taskbar{
  position:fixed;left:0;right:0;bottom:0;height:var(--tb);z-index:5000;
  display:flex;align-items:center;gap:8px;padding:0 8px;
  background:linear-gradient(rgba(255,255,255,.72),rgba(240,240,240,.72));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid #b5b5b5;
  box-shadow:0 -1px 0 rgba(255,255,255,.8) inset;
}
#orb{
  width:38px;height:38px;border-radius:50%;border:none;background:transparent;padding:0;
  display:flex;align-items:center;justify-content:center;flex:0 0 38px;
  transition:transform .08s;
}
#orb img{width:34px;height:34px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
#orb:hover{transform:scale(1.06)}
#orb:active{transform:scale(.95)}
#tasks{display:flex;gap:5px;flex:1;overflow:hidden;align-items:center}
.task{
  display:flex;align-items:center;gap:6px;height:34px;min-width:0;max-width:150px;
  padding:0 9px;border:1px solid #9a9a9a;border-radius:4px;
  background:linear-gradient(rgba(255,255,255,.9),rgba(238,238,238,.9));
  box-shadow:0 1px 2px rgba(0,0,0,.12);
}
.task img{width:16px;height:16px;flex:0 0 16px}
.task span{font-size:11px;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task:hover{background:linear-gradient(#fff,#e4e4e4)}
.task.on{
  background:#fff;border-color:#666;
  box-shadow:inset 0 0 0 1px #fff,0 1px 3px rgba(0,0,0,.2);
}
.task.dim{opacity:.75}
#tray{display:flex;align-items:center;gap:9px;padding:0 8px;height:34px;
  border-left:1px solid #c8c8c8}
#tray img{width:16px;height:16px}
#clock{font-family:var(--pix);font-size:8px;line-height:1.7;text-align:right;color:#222;
  text-shadow:0 0 2px #fff}

/* ---------- start menu ---------- */
#startmenu{
  position:fixed;left:10px;bottom:calc(var(--tb) + 10px);width:340px;max-width:92vw;z-index:6000;
  display:flex;overflow:hidden;border-radius:9px;
  border:1px solid #777;box-shadow:0 12px 34px rgba(0,0,0,.3);
  background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
  animation:smIn .14s ease-out;
}
@keyframes smIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
#startmenu .smL{
  width:196px;flex:0 0 196px;padding:8px;
  background:linear-gradient(rgba(244,244,244,.95),rgba(232,232,232,.95));
  border-right:1px solid #cfcfcf;
  display:flex;flex-direction:column;gap:2px;overflow-y:auto;max-height:60vh;
}
.smi{
  display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:4px;border:1px solid transparent;
  background:none;text-align:left;
}
.smi img{width:18px;height:18px}
.smi span{font-size:12px;color:#111}
.smi:hover{background:rgba(212,163,115,.25);border-color:var(--acc)}
#startmenu .smR{flex:1;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
#smUser{display:flex;align-items:center;gap:9px;padding-bottom:9px;border-bottom:1px solid #ddd}
#smUser canvas{width:34px;height:34px;flex:0 0 34px}
#smUser b{display:block;font-size:12px}
#smUser i{display:block;font-family:var(--pix);font-size:6px;color:#777;font-style:normal;margin-top:4px}
#smLogo{margin:auto 0}
#smLogo img{width:44px}
#btnOff{
  display:flex;align-items:center;gap:8px;justify-content:center;
  font-family:var(--pix);font-size:7px;padding:9px;border:2px solid #000;background:#fff;
  box-shadow:2px 2px 0 #000;border-radius:3px;
}
#btnOff:hover{background:var(--acc)}
#btnOff img{width:14px;height:14px}

/* ---------- boot / shutdown ---------- */
#boot{
  position:fixed;inset:0;z-index:9000;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  transition:opacity .5s;
}
#boot img{width:104px}
#boot .b21{font-family:var(--pix);font-size:26px;letter-spacing:4px}
#boot .b21 em{font-style:normal;color:var(--acc-d)}
#bootBar{display:flex;gap:3px}
#bootBar i{width:14px;height:16px;background:#e2e2e2;border:1px solid #bbb}
#bootBar i.on{background:var(--acc);border-color:#000}
#boot .skip{font-family:var(--pix);font-size:6px;color:#999;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}
#shut{
  position:fixed;inset:0;z-index:9000;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
}
#shut h2{font-family:var(--pix);font-size:11px;color:#333;text-align:center;line-height:2}
#shut button{
  width:64px;height:64px;border-radius:50%;border:3px solid #000;background:var(--acc);
  display:flex;align-items:center;justify-content:center;
  box-shadow:4px 4px 0 rgba(0,0,0,.15);
}
#shut button img{width:30px;height:30px}
#shut button:active{transform:translate(2px,2px);box-shadow:none}

/* ---------- toasts ---------- */
#toasts{position:fixed;top:10px;right:10px;z-index:8000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:9px;max-width:250px;
  background:#fff;border:2px solid #000;border-radius:4px;
  box-shadow:3px 3px 0 rgba(0,0,0,.18);padding:8px 11px;
  font-family:var(--pix);font-size:7px;line-height:1.7;
  animation:tIn .18s ease-out;
}
.toast.out{animation:tOut .3s ease-in forwards}
@keyframes tIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes tOut{to{transform:translateX(30px);opacity:0}}
.toast img,.toast canvas{width:20px;height:20px;flex:0 0 20px}
.toast.xp{border-color:var(--acc-d)}
.toast.xp b{color:var(--acc-d)}
.toast.big{border-width:3px;font-size:8px}

/* ---------- общие элементы приложений ---------- */
.apphead{
  display:flex;align-items:center;gap:9px;padding:9px 10px;
  border-bottom:2px solid #000;background:linear-gradient(#fff,#f2f2f2);
  position:sticky;top:0;z-index:5;
}
.apphead img{width:20px;height:20px}
.apphead .at{flex:1;font-family:var(--pix);font-size:8px}
.appbody{padding:10px}
.btn{
  font-family:var(--pix);font-size:7px;padding:8px 10px;
  border:2px solid #000;background:#fff;color:#111;
  box-shadow:2px 2px 0 #000;border-radius:3px;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn img{width:13px;height:13px}
.btn:hover{background:#f2f2f2}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.acc{background:var(--acc)}
.btn.acc:hover{background:#dfb489}
.btn.dark{background:#161616;color:#fff}
.btn.dark:hover{background:#333}
.btn:disabled{opacity:.35;pointer-events:none}
.chip{
  font-family:var(--pix);font-size:6px;padding:4px 6px;
  border:1px solid #888;background:#f5f5f5;border-radius:2px;white-space:nowrap;
}
.chip.xp{border-color:var(--acc-d);background:#faf1e7;color:#7c5836}
.chip.coin{border-color:var(--acc-d);background:#fff}
input[type=text],textarea{
  font-family:var(--body);font-size:12px;color:#111;
  border:2px solid #000;border-radius:3px;padding:7px 8px;background:#fff;width:100%;
}
textarea{resize:vertical;min-height:52px}
input:focus,textarea:focus{outline:none;border-color:var(--acc-d);box-shadow:0 0 0 2px rgba(212,163,115,.4)}
.lbl{font-family:var(--pix);font-size:7px;color:#555;display:block;margin:9px 0 5px}
.hr{border:none;border-top:2px dotted #bbb;margin:12px 0}

/* сегментные шкалы (инфографика) */
.segbar{display:flex;gap:2px}
.segbar i{width:9px;height:13px;background:#ececec;border:1px solid #c4c4c4}
.segbar i.on{background:var(--acc);border-color:#000}
.segbar.big i{width:13px;height:16px}
.segbar.karma i{width:9px;height:15px}
.segbar.karma i.neg{background:#111;border-color:#111}
.segbar.karma i.pos{background:var(--acc);border-color:#000}
.segbar.karma i.mid{background:#e8e8e8;border-color:#bbb}
.segbar.karma i.cur{box-shadow:0 0 0 2px #000}

/* ---------- карта ---------- */
.mapwrap{position:relative;width:100%;height:100%;background:#fff}
#mapbox{position:absolute;inset:0}
#mapbox.ymap{filter:grayscale(1) contrast(1.06) brightness(1.03)}
.mapfallback{
  position:absolute;inset:0;background:url('assets/map_bg.png') no-repeat center/cover;
}
.fmark{position:absolute;width:22px;height:26px;transform:translate(-50%,-100%);cursor:pointer}
.fmark img{width:22px;height:26px}
.fmark:hover{filter:drop-shadow(0 0 3px rgba(0,0,0,.5))}
.mapbanner{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:10;
  background:#161616;color:#fff;font-family:var(--pix);font-size:6px;
  padding:7px 10px;border:2px solid var(--acc);border-radius:3px;
  display:flex;gap:10px;align-items:center;max-width:92%;
}
.mapbanner button{background:none;border:none;color:var(--acc);font-family:var(--pix);font-size:6px}
.mapctl{position:absolute;right:8px;top:8px;z-index:9;display:flex;flex-direction:column;gap:5px}
.mapctl button{
  width:30px;height:30px;border:2px solid #000;background:#fff;font-family:var(--pix);font-size:9px;
  box-shadow:2px 2px 0 rgba(0,0,0,.25);border-radius:3px;
}
.mapctl button:active{transform:translate(1px,1px);box-shadow:none}
.ymap-balloon{font-family:var(--body)!important}
.bal{font-family:var(--body);font-size:12px;min-width:150px;max-width:200px}
.bal .bt{font-family:var(--pix);font-size:7px;margin-bottom:7px;display:flex;gap:7px;align-items:center}
.bal .bt img{width:16px;height:16px}
.bal .bchips{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.bal .bb{display:flex;gap:6px;flex-wrap:wrap}
.bal .btn{font-size:6px;padding:7px 8px}

/* ---------- квесты ---------- */
.qstats{display:flex;gap:7px}
.qstat{
  display:flex;align-items:center;gap:6px;padding:5px 8px;
  border:1px solid #888;border-radius:3px;background:#f7f7f7;
}
.qstat b{font-family:var(--pix);font-size:9px}
.qstat i{font-family:var(--pix);font-size:5px;color:#777;font-style:normal}
.qcard{
  display:flex;gap:10px;align-items:center;
  border:2px solid #000;border-radius:4px;background:#fff;
  box-shadow:3px 3px 0 rgba(0,0,0,.12);
  padding:9px;margin-bottom:9px;
}
.qcard.doing{border-color:var(--acc-d);box-shadow:3px 3px 0 rgba(212,163,115,.4)}
.qcard.done{opacity:.55}
.qcard .qi{width:34px;height:34px;flex:0 0 34px}
.qcard .qm{flex:1;min-width:0}
.qcard .qt{font-size:13px;font-weight:600;line-height:1.35;margin-bottom:6px}
.qcard .qc{display:flex;gap:5px;flex-wrap:wrap}
.qcard .qa{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.stgif{width:44px;height:13px}

/* ---------- профиль ---------- */
.prow{display:flex;gap:12px;flex-wrap:wrap}
.pcol{flex:1;min-width:150px}
.pcard{
  border:2px solid #000;border-radius:4px;background:#fff;
  box-shadow:3px 3px 0 rgba(0,0,0,.1);padding:10px;margin-bottom:10px;
}
.pcard h3{font-family:var(--pix);font-size:7px;color:#555;margin-bottom:9px}
.pavatar{
  display:flex;flex-direction:column;align-items:center;gap:9px;
  border:2px solid #000;border-radius:4px;padding:14px 10px;
  background:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-size:8px 8px;
  box-shadow:3px 3px 0 rgba(0,0,0,.1);margin-bottom:10px;
}
.pavatar canvas{animation:float 2.4s steps(2) infinite}
@keyframes float{50%{transform:translateY(-2px)}}
.pavatar .pn{font-family:var(--pix);font-size:9px;text-align:center}
.pavatar .pl{font-family:var(--pix);font-size:6px;color:var(--acc-d)}
.lvlring{position:relative;width:86px;height:86px;margin:0 auto}
.lvlring svg{transform:rotate(-90deg)}
.lvlring .lv{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--pix);font-size:20px;
}
.lvlring .lvt{position:absolute;bottom:-2px;left:0;right:0;text-align:center;font-family:var(--pix);font-size:5px;color:#888}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{
  display:flex;align-items:center;gap:8px;padding:8px;border:1px solid #999;border-radius:3px;background:#f8f8f8;
}
.stat img{width:18px;height:18px}
.stat b{font-family:var(--pix);font-size:11px}
.stat i{display:block;font-family:var(--pix);font-size:5px;color:#777;font-style:normal;margin-top:3px}
.badges{display:flex;gap:7px;flex-wrap:wrap}
.badge{
  width:40px;display:flex;flex-direction:column;align-items:center;gap:4px;
  border:1px solid transparent;border-radius:3px;padding:4px 2px;cursor:help;
}
.badge img{width:26px;height:26px}
.badge.lock img{filter:grayscale(1) opacity(.35)}
.badge span{font-family:var(--pix);font-size:5px;color:#888;text-align:center}

/* ---------- энциклопедия ---------- */
.etabs{display:flex;gap:5px;padding:9px 10px;border-bottom:2px solid #000;background:#f7f7f7}
.etab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  border:2px solid #999;border-radius:3px;background:#fff;padding:8px 2px;
  font-family:var(--pix);font-size:5px;color:#555;
}
.etab img{width:22px;height:22px}
.etab.on{border-color:#000;background:var(--acc);color:#111;box-shadow:2px 2px 0 rgba(0,0,0,.2)}
.epane{padding:12px;display:none}
.epane.on{display:block}
.ehero{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ehero img{width:52px;height:52px}
.ehero .et{font-family:var(--pix);font-size:9px}
.ehero .ed{font-size:12px;color:#555;margin-top:6px;line-height:1.5}
.erow{margin-bottom:11px}
.erow .er{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.erow .el{display:flex;gap:7px;align-items:center;font-size:12px;color:#333}
.erow .el img{width:15px;height:15px}
.erow b{font-family:var(--pix);font-size:9px}
.etip{
  margin-top:12px;border:2px dotted var(--acc-d);border-radius:4px;
  padding:9px 10px;font-size:12px;color:#444;background:#fdf9f4;line-height:1.5;
}

/* ---------- кошелёк ---------- */
.walletbox{
  display:flex;align-items:center;gap:12px;border:2px solid #000;border-radius:4px;
  padding:12px;margin-bottom:11px;box-shadow:3px 3px 0 rgba(0,0,0,.1);
  background:radial-gradient(rgba(0,0,0,.04) 1px,transparent 1px);background-size:7px 7px;
}
.walletbox img{width:38px;height:38px}
.walletbox .wv{font-family:var(--pix);font-size:17px}
.walletbox .wl{font-family:var(--pix);font-size:5px;color:#777;margin-top:5px}
.camp{border:2px solid #000;border-radius:4px;padding:10px;margin-bottom:9px;box-shadow:3px 3px 0 rgba(0,0,0,.1)}
.camp .ct{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.camp .cn{font-size:13px;font-weight:600}

<script>
/* ================================================================
   21 — городская ОС · single-file app · все данные в localStorage
   ================================================================ */
'use strict';
/*QR:BEGIN*/
// «21» QR-кодер: byte mode, EC level L, версии 1–5, выбор маски по penalty.
// Чистый JS, без зависимостей. QR21.encode(text) → {size, get(x,y), mask, version}
const QR21 = (function () {
  'use strict';
  // --- GF(256), примитив 0x11D ---
  const EXP = new Int32Array(512), LOG = new Int32Array(256);
  (function () {
    let x = 1;
    for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
    for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  })();
  const gmul = (a, b) => (a && b) ? EXP[LOG[a] + LOG[b]] : 0;

  // EC level L, версии 1..5: [dataCodewords, ecCodewords]
  const L = [[19, 7], [34, 10], [55, 15], [80, 20], [108, 26]];

  function rsGen(deg) { // полином делителя, коэффициенты по возрастанию степени
    let g = [1];
    for (let i = 0; i < deg; i++) {
      const a = EXP[i];
      const ng = new Array(g.length + 1).fill(0);
      for (let k = 0; k < g.length; k++) {
        ng[k] ^= gmul(g[k], a);
        ng[k + 1] ^= g[k];
      }
      g = ng;
    }
    return g; // g[deg] === 1
  }

  function rsEncode(data, deg) {
    const gen = rsGen(deg); // gen[k] — коэффициент x^k, gen[deg]=1
    const rem = new Array(deg).fill(0);
    for (let i = 0; i < data.length; i++) {
      const factor = data[i] ^ rem[0];
      rem.shift(); rem.push(0);
      // rem[k] имеет степень deg-1-k → умножаем на gen[deg-1-k]
      if (factor) for (let k = 0; k < deg; k++) rem[k] ^= gmul(gen[deg - 1 - k], factor);
    }
    return rem;
  }

  const MASKS = [
    (x, y) => (x + y) % 2 === 0,
    (x, y) => y % 2 === 0,
    (x, y) => x % 3 === 0,
    (x, y) => (x + y) % 3 === 0,
    (x, y) => (((y >> 1) & 1) + Math.floor(x / 3)) % 2 === 0,
    (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
    (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0,
    (x, y) => (((x * y) % 3) + ((x + y) % 2)) % 2 === 0,
  ];

  function formatBits(mask) {
    const data = (1 << 3) | mask; // EC L
    let rem = data;
    for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    return ((data << 10) | rem) ^ 0x5412;
  }

  function encode(text) {
    const bytes = new TextEncoder().encode(text);
    let ver = 0;
    for (let v = 1; v <= L.length; v++) {
      if (4 + 8 + bytes.length * 8 <= L[v - 1][0] * 8) { ver = v; break; }
    }
    if (!ver) throw new Error('QR: data too long');
    const dataCw = L[ver - 1][0], ecCw = L[ver - 1][1];
    const n = 17 + 4 * ver;

    // биты данных
    const bits = [];
    const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    push(4, 4);
    push(bytes.length, 8);
    for (let i = 0; i < bytes.length; i++) push(bytes[i], 8);
    push(0, Math.min(4, dataCw * 8 - bits.length));
    while (bits.length % 8) bits.push(0);
    const pads = [0xec, 0x11];
    let pi = 0;
    while (bits.length < dataCw * 8) { push(pads[pi & 1], 8); pi++; }
    const data = [];
    for (let i = 0; i < bits.length; i += 8) {
      let b = 0;
      for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
      data.push(b);
    }
    const all = data.concat(rsEncode(data, ecCw));

    // матрица
    const mod = Array.from({ length: n }, () => new Array(n).fill(null));
    const isFunc = Array.from({ length: n }, () => new Array(n).fill(false));
    const set = (x, y, dark) => { mod[y][x] = dark ? 1 : 0; isFunc[y][x] = true; };

    function finder(cx, cy) {
      for (let dy = -1; dy <= 7; dy++) for (let dx = -1; dx <= 7; dx++) {
        const x = cx + dx, y = cy + dy;
        if (x < 0 || x >= n || y < 0 || y >= n) continue;
        let dark;
        if (dx < 0 || dx > 6 || dy < 0 || dy > 6) dark = false; // сепаратор
        else { const m = Math.max(Math.abs(dx - 3), Math.abs(dy - 3)); dark = m !== 2; }
        set(x, y, dark);
      }
    }
    finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
    for (let i = 8; i <= n - 9; i++) {
      if (mod[6][i] === null) set(i, 6, i % 2 === 0);
      if (mod[i][6] === null) set(6, i, i % 2 === 0);
    }
    if (ver >= 2) {
      const c = n - 7;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
        set(c + dx, c + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    // резерв под формат (заполним для выбранной маски)
    for (let i = 0; i <= 8; i++) {
      if (mod[8][i] === null) set(i, 8, 0);
      if (mod[i][8] === null) set(8, i, 0);
    }
    for (let i = 0; i < 8; i++) set(n - 1 - i, 8, 0);
    for (let i = 0; i < 7; i++) set(8, n - 7 + i, 0);
    set(8, n - 8, 1); // тёмный модуль (row size-8, col 8)

    // зигзаг данных
    let bi = 0;
    const totalBits = all.length * 8;
    for (let col = n - 1; col >= 1; col -= 2) {
      if (col === 6) col--;
      for (let k = 0; k < n; k++) {
        for (let c = 0; c < 2; c++) {
          const x = col - c;
          const y = (((col + 1) & 2) === 0) ? n - 1 - k : k;
          if (mod[y][x] === null) {
            mod[y][x] = bi < totalBits ? (all[bi >> 3] >>> (7 - (bi & 7))) & 1 : 0;
            bi++;
          }
        }
      }
    }

    // выбор маски
    const clone = () => mod.map(r => r.slice());
    function drawFormat(bits, m) {
      const b = i => ((bits >>> i) & 1) !== 0;
      // копия 1: (8,i) i=0..5; (8,7); (8,8); (7,8); (14-i,8) i=9..14
      for (let i = 0; i <= 5; i++) m[i][8] = b(i) ? 1 : 0;
      m[7][8] = b(6) ? 1 : 0; m[8][8] = b(7) ? 1 : 0; m[8][7] = b(8) ? 1 : 0;
      for (let i = 9; i < 15; i++) m[8][14 - i] = b(i) ? 1 : 0;
      // копия 2: (size-1-i,8) i=0..7; (8,size-15+i) i=8..14
      for (let i = 0; i < 8; i++) m[8][n - 1 - i] = b(i) ? 1 : 0;
      for (let i = 8; i < 15; i++) m[n - 15 + i][8] = b(i) ? 1 : 0;
      // тёмный модуль (row size-8, col 8)
      m[n - 8][8] = 1;
    }
    function penalty(m) {
      let s = 0;
      for (let y = 0; y < n; y++) {
        let run = 1;
        for (let x = 1; x < n; x++) {
          if (m[y][x] === m[y][x - 1]) run++;
          else { if (run >= 5) s += 3 + (run - 5); run = 1; }
        }
        if (run >= 5) s += 3 + (run - 5);
      }
      for (let x = 0; x < n; x++) {
        let run = 1;
        for (let y = 1; y < n; y++) {
          if (m[y][x] === m[y - 1][x]) run++;
          else { if (run >= 5) s += 3 + (run - 5); run = 1; }
        }
        if (run >= 5) s += 3 + (run - 5);
      }
      for (let y = 0; y < n - 1; y++) for (let x = 0; x < n - 1; x++) {
        const c = m[y][x];
        if (c === m[y][x + 1] && c === m[y + 1][x] && c === m[y + 1][x + 1]) s += 3;
      }
      const pat = [1, 0, 1, 1, 1, 0, 1];
      for (let y = 0; y < n; y++) for (let x = 0; x <= n - 7; x++) {
        let ok = true;
        for (let i = 0; i < 7; i++) if (m[y][x + i] !== pat[i]) { ok = false; break; }
        if (!ok) continue;
        const before = x >= 4 && !m[y][x - 1] && !m[y][x - 2] && !m[y][x - 3] && !m[y][x - 4];
        const after = x + 11 < n && !m[y][x + 7] && !m[y][x + 8] && !m[y][x + 9] && !m[y][x + 10];
        if (before || after) s += 40;
      }
      for (let x = 0; x < n; x++) for (let y = 0; y <= n - 7; y++) {
        let ok = true;
        for (let i = 0; i < 7; i++) if (m[y + i][x] !== pat[i]) { ok = false; break; }
        if (!ok) continue;
        const before = y >= 4 && !m[y - 1][x] && !m[y - 2][x] && !m[y - 3][x] && !m[y - 4][x];
        const after = y + 11 < n && !m[y + 7][x] && !m[y + 8][x] && !m[y + 9][x] && !m[y + 10][x];
        if (before || after) s += 40;
      }
      let dark = 0;
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) dark += m[y][x];
      s += Math.floor(Math.abs(dark * 100 / (n * n) - 50) / 5) * 10;
      return s;
    }

    let best = null, bestPen = Infinity;
    for (let mk = 0; mk < 8; mk++) {
      const m = clone();
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        if (!isFunc[y][x] && MASKS[mk](x, y)) m[y][x] ^= 1;
      }
      drawFormat(formatBits(mk), m);
      const p = penalty(m);
      if (p < bestPen) { bestPen = p; best = m; }
    }
    return {
      size: n,
      version: ver,
      mask: -1,
      get: (x, y) => best[y][x] === 1,
    };
  }

  return { encode };
})();
/*QR:END*/

const imgCache = new Map();
function loadImg(src) {
  if (imgCache.has(src)) return Promise.resolve(imgCache.get(src));
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => { imgCache.set(src, i); res(i); };
    i.onerror = rej;
    i.src = src;
  });
}

function hexRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
async function drawAvatar(ctx, av, size) {

/* ---------------- пикселизация изображений ---------------- */
function pixelateFile(file, maxPx = 48) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const s = Math.min(maxPx / img.width, maxPx / img.height, 1);
        const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const cx = c.getContext('2d');
        cx.drawImage(img, 0, 0, w, h);
        const d = cx.getImageData(0, 0, w, h), p = d.data;
        const steps = [255, 224, 192, 160, 128, 96, 64, 32, 0];
        for (let i = 0; i < p.length; i += 4) {
          const r = p[i], g = p[i + 1], b = p[i + 2];
          if (r > g && g >= b && (r - b) > 28 && r > 90) { p[i] = 212; p[i + 1] = 163; p[i + 2] = 115; continue; }
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          let best = steps[0], bd = 1e9;
          for (const sv of steps) { const dd = Math.abs(lum - sv); if (dd < bd) { bd = dd; best = sv; } }
          p[i] = p[i + 1] = p[i + 2] = best;
        }
        cx.putImageData(d, 0, 0);
        res(c.toDataURL('image/png'));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------------- QR в canvas ---------------- */
function drawQR(ctx, text, x, y, size) {
  const q = QR21.encode(text);
  const scale = Math.floor(size / q.size);
  const off = Math.floor((size - q.size * scale) / 2);
  ctx.save();
  ctx.fillStyle = '#000';
  for (let yy = 0; yy < q.size; yy++)
    for (let xx = 0; xx < q.size; xx++)
      if (q.get(xx, yy)) ctx.fillRect(x + off + xx * scale, y + off + yy * scale, scale, scale);
  ctx.restore();
}

  bC.addEventListener('click', () => ymap && ymap.setCenter(CENTER, { duration: 200 }));

  loadYandex().then(ok => {
    if (!wins.has(win.id)) return;
    if (ok) {
      ymaps.ready(() => {
        if (!wins.has(win.id)) return;
        ymap = new ymaps.Map('mapbox', { center: CENTER, zoom: 15, controls: [] }, { searchControlProvider: 'yandex#search' });
        box.classList.add('ymap');
        ymap.events.add('click', e => {
          if (!placing) return;
          const [lat, lng] = e.get('coords');
          addProblem(placing.type, placing.title || 'Проблема', lat, lng);
          placing = null; setBanner();
        });
        refreshMarkers();
        setBanner();
      });
    } else {
      // статичная пиксель-карта
      const staticMap = el('div', 'mapfallback');
      box.innerHTML = '';
      box.appendChild(staticMap);
      staticMap.addEventListener('click', e => {
        if (!placing) return;
        const r = staticMap.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
        addProblem(placing.type, placing.title || 'Проблема',
          CENTER[0] - (py - 0.5) * BOUNDS.lat * 2, CENTER[1] + (px - 0.5) * BOUNDS.lng * 2);
        placing = null; setBanner();
      });
      refreshStaticMarkers(staticMap);
      setBanner();
    }
  });
  win.mapBox = box;
}
function refreshMarkers() {
  if (!ymap) return;
  ymarks.forEach(m => ymap.remove(m));
  ymarks = [];
  const add = (lat, lng, kind, title, type, id) => {
    const m = new ymaps.Placemark([lat, lng], { balloonContent: mapMarkerHTML(kind, title, type, id) },
      { preset: 'islands#image', iconImageHref: MK[kind], iconSize: [22, 26], iconImageOffset: [-11, -24] });
    ymap.add(m); ymarks.push(m);
  };
  st.quests.forEach(q => add(q.x, q.y, q.status === 'done' ? 'done' : 'quest', q.title, q.type, q.id));
  st.problems.forEach(p => add(p.x, p.y, 'problem', p.title, p.type, p.id));
}
function refreshStaticMarkers(box) {
  if (!box) return;
  box.querySelectorAll('.fmark').forEach(m => m.remove());
  const mk = (lat, lng, kind, title, type, id) => {
    const [x, y] = proj(lat, lng);
    const d = el('div', 'fmark');
    d.style.left = x + '%'; d.style.top = y + '%';
    d.title = title;
    d.appendChild(imgTag(MK[kind]));
    d.addEventListener('click', e => { e.stopPropagation(); miniPopup(kind, title, type, id, d); });
    box.appendChild(d);
  };
  st.quests.forEach(q => mk(q.x, q.y, q.status === 'done' ? 'done' : 'quest', q.title, q.type, q.id));
  st.problems.forEach(p => mk(p.x, p.y, 'problem', p.title, p.type, p.id));
}
function miniPopup(kind, title, type, id, anchor) {
  const old = document.querySelector('#miniPop'); if (old) old.remove();
  const d = el('div'); d.id = 'miniPop';
  d.style.cssText = 'position:fixed;z-index:7000;max-width:220px';
  const r = anchor.getBoundingClientRect();
  d.style.left = clamp(r.left + r.width / 2 - 90, 8, innerWidth - 230) + 'px';
  d.style.top = (r.top - 10) + 'px';
  d.style.transform = 'translateY(-100%)';
  d.innerHTML = mapMarkerHTML(kind, title, type, id);
  document.body.appendChild(d);
  setTimeout(() => { const m = document.querySelector('#miniPop'); if (m && m === d) d.remove(); }, 6000);
  document.addEventListener('pointerdown', function h(e) { if (!d.contains(e.target)) { d.remove(); document.removeEventListener('pointerdown', h); } });
}

window.__os = {
  quest(id, act) {
    const q = st.quests.find(q => q.id === id);
    if (!q) return;
    if (act === 'start' && q.status === 'active') { q.status = 'doing'; save(); refreshOpen(); toast('КВЕСТ В РАБОТЕ', '', 'assets/working.gif'); }
    if (act === 'done' && q.status === 'doing') {
      q.status = 'done';
      st.counters.quests++;
      save();
      addKarma(1);
      if (q.money) addWallet(q.money);
      addXP(q.xp);
      award('first', 'Первый квест');
      if (st.counters.quests >= 10) award('ten', '10 квестов');
      refreshOpen();
    }
  },
  problem2quest(id) {
    const p = st.problems.find(p => p.id === id);
    if (!p) return;
    st.problems = st.problems.filter(x => x.id !== id);
    st.quests.push({ id: uid(), type: p.type, title: p.title, x: p.x, y: p.y, status: 'active', xp: 40 + Math.floor(Math.random() * 40), money: 0 });
    save(); refreshOpen();
    toast('ПРОБЛЕМА → КВЕСТ', 'xp', 'assets/ic_quest.png');
  },
  addProblem(type, title) {
    addProblem(type, title,
      CENTER[0] + (Math.random() - 0.5) * BOUNDS.lat,
      CENTER[1] + (Math.random() - 0.5) * BOUNDS.lng);
  },
  vote(id, v) {
    const c = st.cases.find(c => c.id === id);
    if (!c) return;
    if (c.my === v) return;
    if (c.my) c.votes[c.my]--;
    c.votes[v]++;
    c.my = v;
    st.counters.votes++;
    save();
    if (st.counters.votes === 1) { award('voter', 'Первый голос'); addXP(5); }
    refreshOpen();
  },
  donate(id, amt) {
    const c = st.camps.find(c => c.id === id);
    if (!c || st.user.wallet < amt) { if (st.user.wallet < amt) toast('МАЛО ₣', ''); return; }
    c.raised = Math.min(c.goal, c.raised + amt);
    st.user.wallet -= amt;
    st.counters.dons++;
    st.log.unshift({ t: 'don', s: `−${amt} ₣ → ${c.title}`, ts: Date.now() });
    st.log = st.log.slice(0, 8);
    save();
    if (st.counters.dons === 1) { award('donor', 'Первая доната'); addXP(5); }
    toast(`−${amt} ₣ · ${c.title}`, '', 'assets/ic_coin.png');
    refreshOpen();
  },
  applyAI(plan) {
    plan.forEach(([id, amt]) => {
      const c = st.camps.find(c => c.id === id);
      if (!c || amt <= 0) return;
      const real = Math.min(amt, st.user.wallet);
      if (real < 10) return;
      c.raised = Math.min(c.goal, c.raised + real);
      st.user.wallet -= real;
      st.log.unshift({ t: 'ai', s: `AI: −${real} ₣ → ${c.title}`, ts: Date.now() });
    });
    st.log = st.log.slice(0, 8);
    st.counters.dons++;
    save();
    addXP(10);
    toast('AI РАСПРЕДЕЛИЛ КОШЕЛЁК', 'xp', 'assets/ic_ai.png');
    refreshOpen();
  },
  saveAvatar(av) {
    st.user.avatar = av;
    save();
    award('style', 'Свой стиль');
    toast('ПЕРСОНАЖ СОХРАНЁН', 'xp', 'assets/ic_char.png');
    refreshOpen();
  },
  setPlacing(type, title) {
    placing = { type, title };
    openApp('map');
    if (mapWinRef && mapWinRef._banner) mapWinRef._banner();
  },
  reset() {
    localStorage.removeItem(LS_KEY);
    location.reload();
  },
};
function addProblem(type, title, lat, lng) {
  st.problems.push({ id: uid(), type, title, x: lat, y: lng });
  st.counters.probs++;
  save();
  if (st.counters.probs === 1) award('admin', 'Первая проблема');
  toast('ПРОБЛЕМА ДОБАВЛЕНА', '', 'assets/mk_problem.png');
  refreshOpen();
}

        const act = st.camps.filter(c => c.raised < c.goal);

          const need = (c.goal - c.raised) / c.goal;
          return { id: c.id, w: 0.55 * need + 0.35 * (1 - c.raised / c.goal) + 0.1 * Math.random() };
        });
        const tot = wgt.reduce((a, x) => a + x.w, 0);
        const plan = wgt.map(x => {
          let amt = Math.floor(W * x.w / tot / 10) * 10;
          return { id: x.id, amt };
        }).filter(p => p.amt >= 10);
        if (!plan.length) { toast('AI: ВСЁ УЖЕ ГОТОВО', ''); aipan.classList.remove('on'); aiBtn.disabled = false; return; }
        aipan.innerHTML = `<div class="ah"><img src="assets/ic_ai.png"><b>ПЛАН AI</b></div>`;
        plan.forEach(p => {
          const c = st.camps.find(c => c.id === p.id);
          const r = el('div', 'airow', '');
          r.innerHTML = `<span>${esc(c.title)}</span><b>+${p.amt} ₣</b>`;
          aipan.appendChild(r);
        });
        const ap = el('button', 'btn dark', 'ПРИМЕНИТЬ');
        ap.style.marginTop = '9px';
        ap.addEventListener('click', () => {
          window.__os.applyAI(plan.map(p => [p.id, p.amt]));
          aipan.classList.remove('on');
        });
        const cn = el('button', 'btn', 'ОТМЕНА');
        cn.style.marginTop = '9px';
        cn.style.marginLeft = '6px';
        cn.addEventListener('click', () => aipan.classList.remove('on'));
        aipan.appendChild(ap); aipan.appendChild(cn);
        aiBtn.disabled = false;
      }, 1300);
    });
    // кампании
    st.camps.forEach(c => {
      const d = el('div', 'camp');
      const pct = Math.round(c.raised / c.goal * 100);
      const ct = el('div', 'ct');
      ct.appendChild(el('span', 'cn', esc(c.title)));
      ct.appendChild(el('span', 'cp', c.raised + ' / ' + c.goal + ' ₣'));
      d.appendChild(ct);
      const row = el('div', 'crow');
      const bar = el('div', 'segbar');
      for (let i = 0; i < 20; i++) bar.appendChild(el('i', i < Math.round(pct / 100 * 20) ? 'on' : '', ''));
      row.appendChild(bar);
      const b10 = el('button', 'btn', '+10');
      const b50 = el('button', 'btn acc', '+50');
      b10.disabled = st.user.wallet < 10 || pct >= 100;
      b50.disabled = st.user.wallet < 50 || pct >= 100;
      b10.addEventListener('click', () => window.__os.donate(c.id, 10));
      b50.addEventListener('click', () => window.__os.donate(c.id, 50));
      row.append(b10, b50);
      d.appendChild(row);
      if (pct >= 100) d.appendChild(el('div', null, '<span class="chip xp" style="margin-top:8px;display:inline-block">СБОР ЗАВЕРШЁН ✓</span>'));
      b.appendChild(d);
    });
    // лог
    if (st.log.length) {
      b.appendChild(el('hr', 'hr'));
      const lg = el('div', 'log');
      lg.appendChild(el('h3', null, 'ЖУРНАЛ'));
      const ul = el('ul');

      <button class="btn danger" onclick="if(confirm('Сбросить все данные?'))__os.reset()">СБРОС</button>
    </div>
  </div>`;
};

/* ---------------- старт ---------------- */
const BOOT_HTML = '<div id="boot">' +
  '<img src="assets/logo.png" alt="21">' +
  '<div class="b21">2<em>1</em></div>' +
  '<div id="bootBar"></div>' +
  '<div class="skip">НАЖМИ ЧТОБЫ ПРОПУСТИТЬ</div>' +
  '</div>';
function boot(slow = true) {
  if (!$('#boot')) document.body.insertAdjacentHTML('afterbegin', BOOT_HTML);
  const bar = $('#bootBar');
  bar.innerHTML = '';
  for (let i = 0; i < 20; i++) bar.appendChild(el('i'));
  const cells = bar.children;
  let i = 0;
  const iv = setInterval(() => {
    if (i < 20) cells[i++].classList.add('on');
    if (i >= 20) {
      clearInterval(iv);
      setTimeout(() => {
        $('#boot').style.opacity = '0';
        setTimeout(() => $('#boot').remove(), 550);
      }, 250);
    }
  }, slow ? 70 : 12);
  $('#boot').addEventListener('click', () => {
    clearInterval(iv);
    $('#boot').style.opacity = '0';
    setTimeout(() => $('#boot').remove(), 400);
  }, { once: true });
}
buildDesktopIcons();
renderUserBits();
boot();

/* service worker (офлайн-кэш) */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
